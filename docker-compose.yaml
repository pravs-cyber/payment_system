services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://payflow:payflow@postgres:5432/payflow
      # simulator (default, offline) or cashfree (real PSP sandbox). Values come from your shell or a .env file.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-simulator}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-local-admin-key}
      JOBS_INTERVAL_MS: ${JOBS_INTERVAL_MS:-15000}
      CASHFREE_ENV: ${CASHFREE_ENV:-sandbox}
      CASHFREE_PG_CLIENT_ID: ${CASHFREE_PG_CLIENT_ID:-}
      CASHFREE_PG_CLIENT_SECRET: ${CASHFREE_PG_CLIENT_SECRET:-}
      CASHFREE_PAYOUT_CLIENT_ID: ${CASHFREE_PAYOUT_CLIENT_ID:-}
      CASHFREE_PAYOUT_CLIENT_SECRET: ${CASHFREE_PAYOUT_CLIENT_SECRET:-}
      CASHFREE_PAYOUT_PUBLIC_KEY: ${CASHFREE_PAYOUT_PUBLIC_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
      POSTGRES_DB: payflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d payflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
