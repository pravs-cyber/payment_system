server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # PayFlow pages live in /public; serve them at the site root (same URLs as Vercel),
  # with or without the .html extension.
  location / {
    try_files $uri $uri.html /public$uri /public$uri.html $uri/ /index.html;
  }

  location = /health {
    proxy_pass http://backend:8000/health;
    proxy_set_header Host $host;
  }

  location /v1/ {
    proxy_pass http://backend:8000/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
